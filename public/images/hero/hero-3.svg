<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="wall-grad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#292724" />
          <stop offset="60%" stop-color="#423e38" />
          <stop offset="100%" stop-color="#cdc7ba" />
        </linearGradient>
        <linearGradient id="floor-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#292724" />
          <stop offset="100%" stop-color="#141312" />
        </linearGradient>
        <linearGradient id="sun-glow" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff8ed" stop-opacity="0.8" />
          <stop offset="40%" stop-color="#faf9f6" stop-opacity="0.2" />
          <stop offset="100%" stop-color="#292724" stop-opacity="0" />
        </linearGradient>
      </defs>
      <!-- Background wall -->
      <rect width="1600" height="1000" fill="#141312" />
      <!-- Left wall in perspective -->
      <polygon points="0,0 450,150 450,750 0,1000" fill="url(#wall-grad)" />
      <!-- Ceiling -->
      <polygon points="0,0 1600,0 1300,150 450,150" fill="#292724" />
      <!-- Floor with timber planks -->
      <polygon points="0,1000 450,750 1300,750 1600,1000" fill="url(#floor-grad)" />
      <!-- Floor plank lines -->
      <g stroke="#141312" stroke-width="2" opacity="0.6">
        <line x1="100" y1="1000" x2="480" y2="750" />
        <line x1="300" y1="1000" x2="520" y2="750" />
        <line x1="600" y1="1000" x2="600" y2="750" />
        <line x1="900" y1="1000" x2="720" y2="750" />
        <line x1="1200" y1="1000" x2="900" y2="750" />
        <line x1="1450" y1="1000" x2="1150" y2="750" />
      </g>
      <!-- Floor-to-ceiling glass aperture -->
      <rect x="450" y="150" width="850" height="600" fill="#121516" />
      <!-- Outside foliage silhouette -->
      <path d="M 450 650 Q 600 500 750 600 T 1100 550 L 1300 750 L 450 750 Z" fill="#0d110f" opacity="0.9" />
      <!-- Window Mullions -->
      <line x1="720" y1="150" x2="720" y2="750" stroke="#141312" stroke-width="8" />
      <line x1="1020" y1="150" x2="1020" y2="750" stroke="#141312" stroke-width="8" />
      <line x1="450" y1="420" x2="1300" y2="420" stroke="#141312" stroke-width="6" />
      <!-- Sunbeam light wash -->
      <polygon points="720,150 1300,150 1600,1000 350,1000" fill="url(#sun-glow)" opacity="0.6" />
      <!-- Minimalist architectural bench/counter -->
      <polygon points="500,600 850,600 950,680 550,680" fill="#cdc7ba" />
      <polygon points="500,600 550,680 550,780 500,700" fill="#94887a" />
      <polygon points="550,680 950,680 950,780 550,780" fill="#292724" />
      <!-- Title watermark -->
      <text x="60" y="940" fill="#faf9f6" opacity="0.3" font-family="monospace" font-size="14" letter-spacing="4">KNOWLE REMODELLING — DOUBLE-HEIGHT CONCRETE & OAK</text>
    </svg>